name: Release Please

on:
  push:
    branches:
      - master
  # manual re-run (e.g. after an action failure) without pushing commits
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Tags created with GITHUB_TOKEN don't trigger push:tags workflows, so the
  # release pipeline is dispatched directly once release-please cuts the tag.
  # workflow_dispatch (not workflow_call) keeps release.yml as the top-level
  # workflow so npm OIDC trusted publishing sees the configured workflow file.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run release.yml -f tag=${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
