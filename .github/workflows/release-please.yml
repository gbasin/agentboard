name: Release Please

on:
  push:
    branches:
      - master
  # manual re-run (e.g. after an action failure) without pushing commits
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Tags created with GITHUB_TOKEN don't trigger push:tags workflows, so the
  # release pipeline is invoked directly once release-please cuts the tag.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
