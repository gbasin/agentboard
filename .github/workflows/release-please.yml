name: Release Please

on:
  push:
    branches:
      - master
  # manual re-run (e.g. after an action failure) without pushing commits
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # 'success' when the app-token step ran, 'skipped'/'failure' when the
      # GITHUB_TOKEN fallback was used — decides whether the tag push already
      # triggers release.yml.
      app_token: ${{ steps.app-token.outcome }}
    steps:
      # Mint the release-please bot identity from a GitHub App. PR commits
      # pushed as github-actions[bot] can't trigger workflows — every
      # pull_request synchronize created a check suite that died at
      # workflow-load (zero jobs, "workflow file issue"). An app token is a
      # real identity, so the release PR runs normal CI (which also validates
      # bun.lock during the release window). Skipped when the app isn't
      # configured — the fallback below keeps GITHUB_TOKEN behavior.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  # Tags created with GITHUB_TOKEN don't trigger push:tags workflows, so the
  # release pipeline is dispatched directly once release-please cuts the tag.
  # workflow_dispatch (not workflow_call) keeps release.yml as the top-level
  # workflow so npm OIDC trusted publishing sees the configured workflow file.
  # Skipped when the app token minted the tag — those pushes DO trigger
  # push:tags, and dispatching a second release.yml run raced the npm
  # publishes (E409 over the just-staged version) on every 0.20.x release.
  release:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true'
      && needs.release-please.outputs.app_token != 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run release.yml -R ${{ github.repository }} -f tag=${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
