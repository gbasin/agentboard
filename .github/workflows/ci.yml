name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # Pinned to 22.04 — the May 18 ubuntu-24.04 runner image regresses child
    # Bun spawns under `bun test --coverage`: the server boot via Bun.spawn in
    # integration tests never becomes healthy regardless of timeout (verified
    # at 60s+ wrappers). Investigating root cause separately; the e2e job
    # below stays on ubuntu-24.04 because Playwright's own webServer launch
    # is unaffected.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency risk scan
        run: bun run deps:risk:ci

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test:ci

      - name: Test (coverage)
        run: bun run test:coverage

      - name: Activity backend coverage (100 percent line threshold)
        run: bun run test:activity:coverage

      - name: Upload activity coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: activity-coverage
          path: coverage/activity/

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Build
        run: bun run build

  e2e:
    # Playwright 1.57 does not support the ubuntu-26.04 image behind latest.
    runs-on: ubuntu-24.04
    # The job normally takes about 27 minutes. Without a limit, a stuck step
    # holds the runner for the 6-hour default.
    timeout-minutes: 60
    # The official Playwright image has Chromium, WebKit, and their system
    # libraries. On the plain runner, `playwright install --with-deps` downloads
    # more than 100 packages with apt from the runner's Ubuntu mirror; twice on
    # 2026-11-06 a slow mirror kept that step running for 28 minutes. The tag
    # must equal the Playwright version in bun.lock; a step below checks it.
    # The job runs as root (the image default) because it must install tmux and
    # a compiler. --ipc=host keeps Chromium off Docker's 64 MB /dev/shm, and
    # --init reaps the child processes of the browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host --init
    # The default shell of a container job is `sh -e`. Bash keeps the behavior
    # of the runner, including pipefail.
    defaults:
      run:
        shell: bash
    env:
      # The runner sets a UTF-8 locale; the image sets none. tmux needs one.
      LANG: C.UTF-8
    steps:
      # tmux for the tests, a compiler for node-pty (see below), unzip for
      # setup-bun, and the process tools that the server and the tests run.
      # This is the only apt step of the job, and it uses the mirror of the
      # image (archive.ubuntu.com), not the mirror of the runner.
      - name: Install tmux and build tools
        timeout-minutes: 5
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            tmux g++ make python3 unzip procps lsof openssh-client

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The workspace belongs to the user of the runner, and the job runs as root.
      - name: Let git use the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: .bun-version

      # Linux node-pty has no bundled prebuild; do not rely on runner-global tools.
      - name: Install native build tooling
        run: npm install --global node-gyp@11.5.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the container has the resolved Playwright version
        env:
          # Keep equal to the tag of the container image above.
          PLAYWRIGHT_IMAGE_VERSION: 1.57.0
        run: |
          resolved="$(bunx playwright --version | awk '{print $2}')"
          echo "Resolved Playwright: $resolved; container: $PLAYWRIGHT_IMAGE_VERSION"
          if [[ "$resolved" != "$PLAYWRIGHT_IMAGE_VERSION" ]]; then
            echo "::error::Playwright is $resolved but the e2e container is $PLAYWRIGHT_IMAGE_VERSION. Update the image tag in ci.yml."
            exit 1
          fi
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-}"; ls "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
          id; node --version; tmux -V; locale

      - name: Build
        run: bun run build

      - name: PR metadata HTTP contention (Chromium and WebKit)
        run: bun scripts/verify-pr-request-priority.ts

      - name: Run e2e tests
        # Specs mutate one shared application, catalog, and tmux fixture.
        run: bunx playwright test --workers=1

      - name: Session activity matrix (desktop and touch Chromium/WebKit)
        run: bunx playwright test --config playwright.activity.config.ts --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-activity-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload activity traces and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-activity-report
          path: |
            playwright-activity-report/
            test-results/
          retention-days: 14

      - name: Media and Links regression (WebKit)
        run: bunx playwright test --config playwright.links.config.ts --project webkit

      - name: Terminal resume regression (Chromium and WebKit)
        run: bunx playwright test --config playwright.resume.config.ts --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-resume-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload resume results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-resume-report
          path: playwright-resume-report/
          retention-days: 7

      - name: Terminal contention regression
        run: bunx playwright test --config playwright.contention.config.ts --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-contention-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload contention results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-contention-report
          path: playwright-contention-report/
          retention-days: 7

      # The ci job skips real-tmux tests (no tmux there); this job has tmux.
      # Run the whole suite the way the release workflow's commit hook does
      # (Linux, tmux present), so a real-tmux test that only fails on Linux is
      # caught here instead of failing the release's master sync step.
      - name: Unit and real-tmux tests (Linux with tmux)
        run: bun run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The grouped-session PTY leak only exists on macOS: there a process keeps
  # its tty after the pty master closes, and the fix finds the discarded shell
  # by that tty. On Linux the tty is dropped, so the reap assertion is skipped.
  pty-leak-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux
        run: brew install tmux

      - name: PTY leak regression tests (real tmux)
        run: |
          bun test src/server/__tests__/groupedSessionLeak.integration.test.ts
          bun test src/server/__tests__/e2eTmuxReap.integration.test.ts

      - name: Terminal relay lifecycle regression (real tmux)
        run: bun test src/server/__tests__/terminalRelay.integration.test.ts

      - name: Build and smoke-test compiled terminal relay
        timeout-minutes: 5
        run: |
          bun run build
          bun build src/server/index.ts src/server/sessionRefreshWorker.ts src/server/logMatchWorker.ts src/server/devinSyncWorker.ts src/server/stallWatchdogWorker.ts src/server/sessionReadWorker.ts src/server/sessionMetadataWorker.ts src/server/sessionActivityWorker.ts src/server/mediaDiscoveryReaderWorker.ts src/server/mediaDiscoveryWriterWorker.ts src/server/mediaThumbnailWorker.ts src/server/terminalRelayWorker.ts src/server/terminalSessionWorker.ts src/server/paneOutputWorker.ts --compile --outfile "$RUNNER_TEMP/agentboard-relay-smoke"
          bun scripts/verify-terminal-relay-binary.ts "$RUNNER_TEMP/agentboard-relay-smoke"
          bun scripts/verify-media-discovery-binary.ts "$RUNNER_TEMP/agentboard-relay-smoke"

      - name: Compiled thumbnail worker recovery and shutdown regression
        timeout-minutes: 2
        run: |
          bun build scripts/verify-media-thumbnail-worker.ts scripts/fixtures/mediaThumbnailDelayedWorker.ts src/server/mediaThumbnailWorker.ts --compile --outfile "$RUNNER_TEMP/agentboard-thumbnail-smoke"
          "$RUNNER_TEMP/agentboard-thumbnail-smoke"
