name: CI

on:
  push:
    branches: [master, main]
  # Stacked feature PRs need the same checks as PRs targeting master/main.
  pull_request:

# The local runner pool is small: a second push to the same branch supersedes
# the first run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency risk scan
        run: bun run deps:risk:ci

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test:ci

      # Pull requests run the unit suite once (test:ci also covers the isolated
      # files the coverage run skips); master pushes add the coverage pass and
      # the artifact. The upload keeps always() so a failed suite still leaves
      # its coverage behind — but only on push.
      - name: Test (coverage)
        if: github.event_name == 'push'
        run: bun run test:coverage

      - name: Upload coverage artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Build
        run: bun run build

  # Pull requests whose every changed path is documentation (the same rule the
  # pre-commit hook uses, scripts/docs-only-changes.sh) skip e2e: the suite
  # cannot be affected by them, and its slow serial run only adds noise.
  # Pushes to master/main always run it.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Exit 2 (paths could not be listed) fails this job; e2e then still
        # runs, because only an explicit docs_only=true skips it.
        run: |
          set +e
          scripts/docs-only-changes.sh "$BASE_SHA...$HEAD_SHA"
          status=$?
          set -e
          case $status in
            0) echo "docs_only=true" >> "$GITHUB_OUTPUT"; echo "Docs-only PR; e2e will be skipped." ;;
            1) echo "docs_only=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not list the PR's changed paths"; exit 1 ;;
          esac

  e2e:
    needs: changes
    # Runs on pushes (changes skipped) and on PRs unless changes said
    # docs-only; a failed or cancelled classification still runs e2e.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # Pin browser CI to an OS supported by locked Playwright 1.57.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The server's workspace discovery shells out to `openspec list --json`
      # per worktree to build the change registry; the change-seeding and
      # workspace-sync specs assert on registry content and cannot pass
      # without the CLI on PATH.
      - name: Ensure openspec CLI is available
        run: |
          if command -v openspec >/dev/null 2>&1; then
            echo "openspec $(openspec --version) already present"
            exit 0
          fi
          bun install -g @fission-ai/openspec@1.12.0
          command -v openspec >/dev/null 2>&1 || {
            echo "::error::openspec install reported success but is not on PATH"
            exit 1
          }

      - name: Ensure tmux is available
        run: |
          if command -v tmux >/dev/null 2>&1; then
            echo "tmux $(tmux -V) already present"
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y tmux
            if ! command -v tmux >/dev/null 2>&1; then
              echo "::error::tmux install reported success but tmux is not on PATH"
              exit 1
            fi
            echo "installed $(tmux -V)"
          else
            echo "::error::tmux is not installed on this runner and cannot be installed (no passwordless sudo). Add tmux to the runner image."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Verify Chromium launches, installing system deps only if needed
        run: |
          if bun scripts/playwright-launch-check.ts; then
            exit 0
          fi
          echo "Chromium failed to launch; installing its system dependencies"
          bunx playwright install-deps chromium
          if ! bun scripts/playwright-launch-check.ts; then
            echo "::error::Chromium cannot launch: system dependencies are missing and could not be installed (no passwordless sudo?). Add Playwright's chromium deps to the runner image."
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Run e2e tests
        # workers=1: these specs share one tmux server and several drive real
        # pane I/O on a timer. Under parallel workers they race each other
        # nondeterministically (observed: a different terminal spec flakes per
        # run). Serial is slower but green every time.
        run: bunx playwright test --workers=1

      # chat.spec.ts drives the scripted chat fixture (approvals, questions,
      # streaming), which the server only enables under NODE_ENV=development
      # and AGENTBOARD_CHAT_FIXTURE=1. Run it as its own invocation on its own
      # port so the fixture's seeded session never appears in the main suite's
      # session lists. workers=1: the fixture scripts one conversation state.
      - name: Run chat fixture e2e tests
        run: NODE_ENV=development AGENTBOARD_CHAT_FIXTURE=1 E2E_PORT=4174 bunx playwright test tests/e2e/chat-background-tasks.spec.ts tests/e2e/chat-codex.spec.ts tests/e2e/chat-context-exhaustion.spec.ts tests/e2e/chat-drafts.spec.ts tests/e2e/chat-font-size.spec.ts tests/e2e/chat-header.spec.ts tests/e2e/chat-mailbox-management.spec.ts tests/e2e/chat-message-copy.spec.ts tests/e2e/chat-outbound-audit.spec.ts tests/e2e/chat-plans.spec.ts tests/e2e/chat-process-metrics.spec.ts tests/e2e/chat-profiles.spec.ts tests/e2e/chat-question-auto-answer.spec.ts tests/e2e/chat-strategy-impact.spec.ts tests/e2e/chat-task-assignment.spec.ts tests/e2e/chat-task-revision.spec.ts tests/e2e/chat-task-worker-choice.spec.ts tests/e2e/chat-team-approval-default.spec.ts tests/e2e/chat-team-messages.spec.ts tests/e2e/chat-team-workspace.spec.ts tests/e2e/chat-teams.spec.ts tests/e2e/chat-transcript-layout.spec.ts tests/e2e/chat-typing-performance.spec.ts tests/e2e/chat.spec.ts tests/e2e/plan-execution.spec.ts tests/e2e/plan-integration.spec.ts tests/e2e/plan-supervision.spec.ts tests/e2e/plan-validation.spec.ts tests/e2e/settings-tabs.spec.ts tests/e2e/strategy.spec.ts tests/e2e/team-page.spec.ts --workers=1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
