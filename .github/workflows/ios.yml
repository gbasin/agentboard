name: Native iOS
on:
  pull_request:
    paths: ['ios/**', 'src/**', 'bun.lock', 'package.json', '.bun-version', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      shard:
        description: Shard to run (PRs always run all shards)
        type: choice
        default: all
        options: [all, terminal, catalog, lifecycle, media, settings]
      appearance:
        description: Appearance to run (PRs always run both)
        type: choice
        default: all
        options: [all, light, dark]
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
jobs:
  build:
    outputs:
      simulator-matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Plan independent simulator jobs
        id: matrix
        env:
          IOS_EVENT_NAME: ${{ github.event_name }}
          IOS_REQUESTED_SHARD: ${{ inputs.shard }}
          IOS_REQUESTED_APPEARANCE: ${{ inputs.appearance }}
        run: |
          simulator_matrix=$(bun ios/scripts/e2e-matrix.ts)
          echo "matrix=$simulator_matrix" >> "$GITHUB_OUTPUT"
      - run: brew install xcodegen
      - run: bun install --frozen-lockfile
      - name: Verify shard coverage
        run: bun test ./ios/scripts/e2e-selection.test.ts ./ios/scripts/e2e-matrix.test.ts ./ios/scripts/ci-diagnostics.test.ts ./ios/scripts/ci-e2e.test.ts
      - name: Build test products once
        run: ios/scripts/build-for-testing.sh
      - name: Archive test products with executable permissions and symlinks
        run: tar -czf ios-test-products.tar.gz -C ios/.build/Build Products
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-ios-test-products
          path: ios-test-products.tar.gz
          retention-days: 3
  simulator:
    needs: build
    strategy:
      fail-fast: false
      # Keep five runners busy while each shard/appearance finishes independently.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.build.outputs.simulator-matrix) }}
    runs-on: macos-26
    timeout-minutes: 40
    env:
      IOS_E2E_SHARD: ${{ matrix.shard }}
      IOS_E2E_MODE: ${{ matrix.appearance }}
      IOS_TEST_PRODUCTS_DIR: ${{ github.workspace }}/ios/.build/Build/Products
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: brew install tmux
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-ios-test-products
      - name: Restore shared test products
        run: |
          mkdir -p ios/.build/Build
          tar -xzf ios-test-products.tar.gz -C ios/.build/Build
      - name: ${{ matrix.appearance }} workflows
        run: ios/scripts/ci-e2e.sh
      - name: Preserve results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-ios-${{ matrix.appearance }}-${{ matrix.shard }}
          path: |
            ios/evidence/*-${{ matrix.appearance }}-*.xcresult
            /tmp/ab-ios-fixture-logs/${{ matrix.appearance }}-*/*.log
            /tmp/ab-ios-parity/*.log
            /tmp/ab-ios-diagnostics/**
