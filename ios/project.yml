name: AgentboardSpike
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.2.2" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      OTHER_LDFLAGS: ["$(inherited)", "-Xlinker", "-interposable"]
      EMIT_FRONTEND_COMMAND_LINES: YES
      OTHER_SWIFT_FLAGS: ["$(inherited)", "-v"]
      COMPILATION_CACHE_ENABLE_CACHING: NO
      ENABLE_DEBUG_DYLIB: NO
packages:
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    exactVersion: 1.6.0
targets:
  AgentboardSpike:
    type: application
    platform: iOS
    dependencies:
      - package: Inject
    postBuildScripts:
      - name: Optional debug injection
        script: |
          if [ "$CONFIGURATION" = Debug ] && [ -n "$INJECTION_RESOURCES" ] && [ -d "$INJECTION_RESOURCES/iOSInjection.bundle" ]; then
            cp -R "$INJECTION_RESOURCES/iOSInjection.bundle" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          fi
        basedOnDependencyAnalysis: false
    info:
      path: AgentboardSpike/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: AgentboardSpike
        excludes: [Web]
      - path: AgentboardSpike/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentboard.ios-spike
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agentboard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Agentboard development server.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  AgentboardSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AgentboardSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentboard.ios-spike.unit-tests
        GENERATE_INFOPLIST_FILE: YES
  AgentboardSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AgentboardSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentboard.ios-spike.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AgentboardSpike:
    build:
      targets:
        AgentboardSpike: all
    test:
      targets: [AgentboardSpikeTests, AgentboardSpikeUITests]
